name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/package-publish.yml@workflow-standard-v1.2
    with:
      package_manager: npm
      publish_enabled: true
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      pre_publish_command: bunx playwright install --with-deps chromium
      validate_command: bun run verify
      publish_command: bun run publish:package
      timeout_minutes: 60
      concurrency_group: publish-package-${{ github.ref }}
      cancel_in_progress: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
