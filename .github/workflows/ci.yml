name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      lint_command: bun run lint
      typecheck_command: bun run check-types
      build_command: bun run build
      unit_test_command: bun run test:unit && bun run test:property && bun run test:coverage && bun run test:types
      timeout_minutes: 30

  integration-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      pre_command: bun run build
      package_check_command: bun run size && bun run test:package && bun run test:consumer && bun run verify:git-install && bun run pack:dry
      timeout_minutes: 30

  e2e-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      build_command: bun run build:example
      install_playwright: true
      e2e_command: bun run test:e2e
      artifact_paths: |
        playwright-report
        test-results
      timeout_minutes: 45

  dependency-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify clean consumer dependency resolution
        uses: moritzbrantner/coding-tooling@8ed470bd2afe903d10850706ab5abcd2ae0def9b
        with:
          operation: dependency-resolution
          bun-version: 1.3.14
          strict: true
          report-path: .artifacts/coding-tooling/dependency-resolution.json

  performance-smoke:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      benchmark_command: bun run perf:smoke
      artifact_paths: bench/results/smoke.json
      timeout_minutes: 30

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs:
      [
        "fast-validation",
        "integration-validation",
        "e2e-validation",
        "dependency-resolution",
        "performance-smoke",
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["fast-validation", "integration-validation", "e2e-validation", "dependency-resolution", "performance-smoke"]'
