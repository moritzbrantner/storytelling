name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      lint_command: bun run lint
      typecheck_command: bun run check-types
      build_command: bun run build
      unit_test_command: bun run test:unit && bun run test:property && bun run test:coverage && bun run test:types
      timeout_minutes: 30
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  integration-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      pre_command: bun run build
      package_check_command: bun run size && bun run test:package && bun run test:consumer && bun run pack:dry
      timeout_minutes: 30
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  e2e-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      build_command: bun run build:example
      install_playwright: true
      e2e_command: bun run test:e2e
      artifact_paths: |
        playwright-report
        test-results
      timeout_minutes: 45
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  dependency-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Verify clean consumer dependency resolution
        uses: moritzbrantner/coding-tooling@8ed470bd2afe903d10850706ab5abcd2ae0def9b
        with:
          operation: dependency-resolution
          bun-version: 1.3.14
          strict: true
          report-path: .artifacts/coding-tooling/dependency-resolution.json

  performance-smoke:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      benchmark_command: bun run perf:smoke
      artifact_paths: bench/results/smoke.json
      timeout_minutes: 30
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  reconcile-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/timeline-editor-development-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Reconcile lockfile with package manifest
        run: bun install --lockfile-only
      - name: Commit exact Bun lockfile delta
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Reconcile Bun lockfile dependency classification"
          git push origin "HEAD:${{ github.head_ref }}"
