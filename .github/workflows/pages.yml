name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      build_command: GITHUB_PAGES=true bun run build:example
      artifact_path: example/dist
      concurrency_group: pages
      cancel_in_progress: false
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
