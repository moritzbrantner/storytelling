name: Full Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "bench/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/benchmark-full.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.3
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      benchmark_command: bun run perf && bun run perf:compare
      artifact_paths: bench/results/latest.json
      timeout_minutes: 60
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
